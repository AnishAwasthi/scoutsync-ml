services:
  postgres:
    image: postgres:16
    container_name: scoutsync-postgres
    environment:
      POSTGRES_USER: scoutsync
      POSTGRES_PASSWORD: scoutsync
      POSTGRES_DB: scoutsync
    ports:
      - "5432:5432"
    volumes:
      - scoutsync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutsync -d scoutsync"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  scoutsync_pgdata:
